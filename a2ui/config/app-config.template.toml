[openai]
model = "gpt-5.4"
base_url = "https://api.openai.com/v1"

[mcp]
active_servers = ["oci_http"]

[mcp.servers.oci_stdio]
transport = "stdio"
command = "uvx"
args = ["--from", "oracle-oci-cloud-mcp-server==1.1.2", "oracle.oci-cloud-mcp-server"]
tool_allowlist = []

[mcp.servers.oci_http]
transport = "http"
url = "http://oci-mcp:8888/mcp"
headers = {}
tool_allowlist = []
